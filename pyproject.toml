[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml_quantity_delivery_risk"
version = "1.0.0"
description = "Machine-learning-informed supplier selection/order allocation with quantity-dependent delivery risk"
authors = [
  {name = "Pradyumna Kaushal"},
  {name = "G. Jegan Jose"},
  {name = "P. Parthiban"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "catboost>=1.2.0",
    "matplotlib>=3.7.0"
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
testpaths = [
    "tests"
]
