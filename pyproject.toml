[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml_quantity_delivery_risk"
version = "1.0.0"
description = "Machine-learning-informed supplier selection/order allocation with quantity-dependent delivery risk"
authors = [
  {name = "Pradyumna Kaushal"},
  {name = "G. Jegan Jose"},
  {name = "P. Parthiban"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.2.6",
    "scikit-learn==1.9.0",
    "catboost==1.2.10",
    "matplotlib==3.10.8"
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
testpaths = [
    "tests"
]
